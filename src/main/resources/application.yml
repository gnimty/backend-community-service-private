spring:
  jpa:
    properties:
      hibernate:
        hbm2ddl:
          auto: create-drop
        format_sql: true
    database: MYSQL
    show-sql: true

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: root
    jdbc-url: jdbc:mysql://localhost:3306/community
    hikari:
      max-lifetime: 60000
      connection-timeout: 30000
      maximum-pool-size: 10

  data:
    mongodb:
      uri: mongodb://localhost:27017/community