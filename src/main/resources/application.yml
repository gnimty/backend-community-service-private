jwt:
  secret: ${JWT_SECRET}

oauth:
  kakao:
    client_id: ${OAUTH_KAKAO_CLIENT_ID}
    client_secret: ${OAUTH_KAKAO_CLIENT_SECRET}
    redirect_uri: ${OAUTH_KAKAO_REDIRECT_URI}
  google:
    client_id: ${OAUTH_GOOGLE_CLIENT_ID}
    client_secret: ${OAUTH_GOOGLE_CLIENT_SECRET}
    redirect_uri: ${OAUTH_GOOGLE_REDIRECT_URI}
  riot:
    client_id: ${OAUTH_RIOT_CLIENT_ID}
    client_secret: ${OAUTH_RIOT_CLIENT_SECRET}
    redirect_uri: ${OAUTH_RIOT_REDIRECT_URI}

server:
  servlet:
    context-path: /community
spring:
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
  jpa:
    properties:
      hibernate:
        format_sql: true
    show-sql: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          timeout: 10000
          starttls:
            enable: true
        debug: true
        transport:
          protocol: smtp
---
spring:
  config:
    activate:
      on-profile: local

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: root
    jdbc-url: jdbc:mysql://localhost:3306/community
    hikari:
      max-lifetime: 60000
      connection-timeout: 30000
      maximum-pool-size: 10
  jpa:
    properties:
      hibernate:
        hbm2ddl:
          auto: create-drop

  data:
    mongodb:
      uri:
      port:
      username:
      password:
      authentication-database: admin
---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    hikari:
      max-lifetime: 60000
      connection-timeout: 30000
      maximum-pool-size: 10
    driver-class-name: org.h2.Driver
    url: jdbc:h2:~/test
    username: sa
    password:

  jpa:
    properties:
      hibernate:
        hbm2ddl:
          auto: create-drop
  h2:
    console:
      enabled: true
      path: /h2-console

---
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    properties:
      hibernate:
        hbm2ddl:
          auto: update
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    hikari:
      max-lifetime: 60000
      connection-timeout: 30000
      maximum-pool-size: 10
    jdbc-url: ${MYSQL_HOST}

  data:
    mongodb:
      uri: ${MONGO_HOST}
      port: ${MONGO_PORT}
      username: ${MONGO_USERNAME}
      password: ${MONGO_PASSWORD}
      authentication-database: admin

  redis:
    host: ${REDIS_HOST}
    port: ${REDIS_PORT}