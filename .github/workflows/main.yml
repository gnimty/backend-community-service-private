name: gnimty-community-server-dev-deploy

on:
  push:
    branches: dev

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@master
        
      - name: ENV, DB_ENV 환경 변수
        run: |
          touch env # env라는 이름의 빈 파일 생성
          echo "${{ secrets.DEV_ENV }}" > .env # DEV_ENV의 값을 읽어와서 .env라는 파일에 쓰기
          touch mongo.env # mongo.env라는 이름의 빈 파일 생성
          echo "${{ secrets.DEV_DB_ENV }}" > db.env # DEV_DB_ENV의 값을 읽어와서 db.env라는 파일에 쓰기

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
        with:
          platforms: 'linux/arm64, linux/arm64/v8'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Build and push
        uses: docker/build-push-action@v3
        with:
          push: true
          tags: kariskan/gnimty-community-server:latest

      - name: docker-compose.yml 파일 이동
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ${{ secrets.DEV_USER }}
          key: ${{ secrets.DEV_SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: docker-compose-dev.yml
          target: "/home/${{ secrets.DEV_USER }}/${{ secrets.DIR }}"

      - name: Docker 이미지 pull 이후 down/up
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ${{ secrets.DEV_USER }}
          key: ${{ secrets.DEV_SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd ${{ secrets.DIR }}
            sudo echo "${{ secrets.DEV_ENV }}" > .env
            sudo echo "${{ secrets.DEV_MONGO_ENV }}" > mongo.env
            sudo docker rm -f $(docker ps -qa)
            sudo docker pull kariskan/gnimty-community-server:latest
            sudo docker-compose -f docker-compose-dev.yml up -d
